<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>{{ title|default("FINN") }}</title>
  <link rel="stylesheet" href="/static/research.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { -webkit-tap-highlight-color: transparent; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col">
  <header class="sticky top-0 z-10 bg-white/90 dark:bg-slate-950/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
    <span class="font-semibold text-lg tracking-tight">FINN</span>
    <span class="text-xs text-slate-500 dark:text-slate-400">{% block header_right %}{% endblock %}</span>
  </header>

  <main class="flex-1 px-4 py-4 pb-20 max-w-2xl w-full mx-auto">
    {% block content %}{% endblock %}
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-10 bg-white/95 dark:bg-slate-950/95 backdrop-blur border-t border-slate-200 dark:border-slate-800">
    <div class="max-w-2xl mx-auto grid grid-cols-3 text-xs">
      <a href="/digest" class="flex flex-col items-center gap-1 py-2.5 {{ 'text-blue-600 dark:text-blue-400 font-medium' if active == 'digest' else 'text-slate-500 dark:text-slate-400' }}">
        <span>Digest</span>
      </a>
      <a href="/alerts" class="flex flex-col items-center gap-1 py-2.5 {{ 'text-blue-600 dark:text-blue-400 font-medium' if active == 'alerts' else 'text-slate-500 dark:text-slate-400' }}">
        <span>Alerts</span>
      </a>
      <a href="/research" class="flex flex-col items-center gap-1 py-2.5 {{ 'text-blue-600 dark:text-blue-400 font-medium' if active == 'research' else 'text-slate-500 dark:text-slate-400' }}">
        <span>Research</span>
      </a>
    </div>
  </nav>
</body>
</html>
