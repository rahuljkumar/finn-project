{% extends "base.html" %}
{% block content %}
<div x-data="{ open: null }" class="flex flex-col gap-4">
  <div>
    <a href="/research" class="text-xs text-slate-400">&larr; Research</a>
    <h1 class="text-xl font-semibold tracking-tight mt-1">{{ ticker }}</h1>
    {% if company_name %}<p class="text-xs text-slate-500 dark:text-slate-400">{{ company_name }}</p>{% endif %}
  </div>

  <button
    @click="open = open === 'pvd' ? null : 'pvd'"
    hx-get="/research/{{ ticker }}/section/promised_vs_delivered"
    hx-target="#section-pvd"
    hx-swap="innerHTML"
    hx-trigger="click"
    class="text-left rounded-xl border-2 border-blue-300 dark:border-blue-800 bg-blue-50 dark:bg-blue-950/40 p-3">
    <div class="flex items-center justify-between">
      <span class="font-medium text-sm">Promised vs. Delivered</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 text-slate-400 transition-transform" :class="{ 'rotate-90': open === 'pvd' }">
        <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
      </svg>
    </div>
    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">Last 4 quarters, guidance vs. actual</div>
  </button>
  <div x-show="open === 'pvd'" x-cloak id="section-pvd" class="text-sm text-slate-400 px-1">Click to load&hellip;</div>

  {% for key, label in categories %}
  <button
    @click="open = open === '{{ key }}' ? null : '{{ key }}'"
    hx-get="/research/{{ ticker }}/section/{{ key }}"
    hx-target="#section-{{ key }}"
    hx-swap="innerHTML"
    hx-trigger="click"
    class="text-left rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3">
    <div class="flex items-center justify-between">
      <span class="font-medium text-sm">{{ label }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 text-slate-400 transition-transform" :class="{ 'rotate-90': open === '{{ key }}' }">
        <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
      </svg>
    </div>
  </button>
  <div x-show="open === '{{ key }}'" x-cloak id="section-{{ key }}" class="text-sm text-slate-400 px-1 -mt-2">Click to load&hellip;</div>
  {% endfor %}
</div>
{% endblock %}
