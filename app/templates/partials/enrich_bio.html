{% if not data.person or not data.person.name %}
<div class="text-xs text-slate-400 mt-2 italic">Couldn't identify a specific individual in this filing.</div>
{% else %}
<div class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-sm">
  <div class="font-medium">{{ data.person.name }}</div>
  <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">{{ data.person.action|title }} &mdash; {{ data.person.role }}</div>
  <p class="text-slate-600 dark:text-slate-300 text-sm">{{ data.bio }}</p>
  <div class="text-[10px] text-slate-400 mt-1">Sourced from public web search &mdash; not a primary filing.</div>
</div>
{% endif %}
