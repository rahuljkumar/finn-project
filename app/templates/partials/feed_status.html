<div role="status" class="text-xs text-slate-500 dark:text-slate-400">
  {% if feed.running %}<div>Refreshing data&hellip; Saved results remain available. This page updates automatically.</div>{% endif %}
  {% if feed.succeeded_at %}<div>Last successful refresh: {{ feed.succeeded_at|display_time }}</div>{% endif %}
  {% if feed.error %}<div class="text-amber-600 dark:text-amber-400">{{ feed.error }}</div>{% endif %}
</div>
